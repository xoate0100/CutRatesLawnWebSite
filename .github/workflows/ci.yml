name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate AI context
        run: pnpm run agentic:context

      - name: Verify (build + agentic gates)
        run: pnpm run verify

      - name: Fail on critical npm advisories
        run: pnpm audit --audit-level=critical

      - name: Start production server
        run: |
          pnpm exec next start -p 3000 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "server failed to start"
          exit 1

      - name: Link + 404 smoke
        run: AUDIT_BASE_URL=http://127.0.0.1:3000 node scripts/ci-link-smoke.mjs
